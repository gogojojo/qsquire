<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran squire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .video-container {
            width: 90%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            position: relative;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .overlay.hidden {
            display: none;
        }

        .form-container {
            background-color: #2a2a2a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            width: 90%;
            max-width: 400px;
        }

        .form-container h2 {
            color: #ffffff;
            margin-bottom: 24px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #666;
        }

        .form-group input::placeholder {
            color: #888;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a9eff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #3a8eef;
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay">
        <div class="form-container">
            <h2>Enter Your Information</h2>
            <form id="infoForm" action="https://formspree.io/f/xeezggqq" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="submit-btn">Enter</button>
            </form>
        </div>
    </div>
    <div class="video-container">
        <iframe title="vimeo-player" src="https://player.vimeo.com/video/1152890506?h=66db5dba06" width="640" height="360" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
    </div>
    <script>
        const overlay = document.getElementById('overlay');
        const form = document.getElementById('infoForm');
        const STORAGE_KEY = 'qsquire_form_submitted';

        // Check if user has already submitted the form
        if (localStorage.getItem(STORAGE_KEY) === 'true') {
            overlay.classList.add('hidden');
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    // Save to localStorage that form has been submitted
                    localStorage.setItem(STORAGE_KEY, 'true');
                    overlay.classList.add('hidden');
                } else {
                    // Still hide overlay even if there's an error
                    // You can add error handling here if needed
                    overlay.classList.add('hidden');
                }
            } catch (error) {
                // Hide overlay even if there's an error
                overlay.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
